name: document_scanner
description: A Flutter package for scanning documents, receipts, and manuals with manual/automatic cropping, perspective correction, filtering, and PDF generation.
version: 3.0.0
homepage: https://github.com/Nardo86/document_scanner
repository: https://github.com/Nardo86/document_scanner
issue_tracker: https://github.com/Nardo86/document_scanner/issues
license: MIT

topics:
  - document-scanner
  - pdf
  - camera
  - image-processing
  - ocr

environment:
  # Dart 3.8 ships with Flutter 3.32+, so the Flutter floor must match.
  sdk: ^3.8.1
  flutter: ">=3.32.0"

dependencies:
  flutter:
    sdk: flutter

  # Image decoding / processing (grayscale, Otsu B&W, CLAHE, homography helpers)
  image: ^4.5.4

  # PDF generation
  pdf: ^3.11.1

  # Native PDF preview rendering
  pdfx: ^2.4.1

  # Live camera capture (guided overlay) + gallery/quick capture.
  # Pinned to the 0.11 line: camera 0.12+ requires Dart >=3.9 (Flutter 3.35+).
  camera: ">=0.11.2+1 <0.13.0"
  image_picker: ^1.1.2

  # QR code scanning (manual download links)
  mobile_scanner: ^7.0.1

  # HTTP for downloading manuals from URLs
  http: ^1.2.2

  # File-system access and path manipulation
  path_provider: ^2.1.4
  path: ^1.9.1

  # Runtime permissions (camera)
  permission_handler: ^12.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mockito: ^5.4.4
  build_runner: ^2.4.9
